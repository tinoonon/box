<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
        }
        
        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            background-color: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            background: transparent;
        }
    </style>
</head>
<body>
    <img src="/box.png" alt="">
</body>
</html>
